# Fly.io config for the headless_backend (thin CRUD-over-Redis service).
# Scale-to-zero: the machine stops when idle and auto-starts on the next request
# (~1-2s), so it costs ~$0 for personal use. Deploy with `fly deploy`.
# Redis creds are set as secrets, not committed here:
#   fly secrets set redis_host=... redis_port=... redis_password=...

app = "sofia-headless-backend"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
